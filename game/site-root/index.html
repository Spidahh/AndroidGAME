<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Holdout City</title>
<meta name="description" content="Holdout City — i giochi delle pubblicità, veri. In sviluppo." />
<style>
  :root { --bg:#1b1f24; --ink:#f4efe6; --loot:#ffd34d; }
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2b3440,#14171b);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  h1{font-size:clamp(34px,9vw,64px);margin:0;letter-spacing:.04em}
  p{margin:0;opacity:.8;max-width:34ch;line-height:1.45}
  a.btn{display:inline-block;background:var(--loot);color:#1d1d1d;font-weight:800;font-size:20px;text-decoration:none;padding:14px 34px;border-radius:14px}
  small{opacity:.55}
</style>
</head>
<body>
<main>
  <h1>HOLDOUT CITY</h1>
  <p>I giochi delle pubblicità, veri. Una città da riconquistare dagli zombie.</p>
  <a class="btn" href="./beta/">Prova la versione in sviluppo</a>
  <small>Versione di prova — non ancora pubblicata sugli store.</small>
</main>
</body>
</html>
